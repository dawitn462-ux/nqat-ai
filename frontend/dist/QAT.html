<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Nqat AI — Security Initialization</title>

    <style>
        /* =========================================================
   NQAT AI — SINGLE FILE WEBSITE / LOADING ANIMATION
   Black / Red / Futuristic Cybersecurity Design
========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #020202;
            color: #fff;
            font-family: Inter, Arial, Helvetica, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .fade-container {
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* =========================================================
   HERO
========================================================= */

        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 45%,
                    rgba(180, 0, 0, .20),
                    transparent 28%),
                radial-gradient(circle at 50% 100%,
                    rgba(255, 0, 0, .08),
                    transparent 45%),
                #020202;
        }

        /* RED ATMOSPHERE */
        .aura {
            position: absolute;
            width: 650px;
            height: 650px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(255, 0, 0, .18),
                    rgba(150, 0, 0, .07) 35%,
                    transparent 70%);
            filter: blur(30px);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(.8);
                opacity: .55;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        /* CYBER GRID */
        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: 20%;
            background-image:
                linear-gradient(rgba(255, 0, 0, .075) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, .075) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(65deg);
            animation: gridMove 5s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 600px; }
        }

        /* ROTATING SECURITY RINGS */
        .rings {
            position: absolute;
            width: 520px;
            height: 520px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 0, 0, .32);
            box-shadow: 0 0 30px rgba(255, 0, 0, .06);
        }

        .ring:nth-child(1) { animation: rotateClockwise 8s linear infinite; }
        .ring:nth-child(2) { inset: 45px; border-style: dashed; animation: rotateCounter 6s linear infinite; }
        .ring:nth-child(3) { inset: 90px; border-color: rgba(255, 40, 40, .45); animation: rotateClockwise 4s linear infinite; }

        @keyframes rotateClockwise { to { transform: rotate(360deg); } }
        @keyframes rotateCounter { to { transform: rotate(-360deg); } }

        /* SECURITY CORE */
        .core {
            position: absolute;
            width: 155px;
            height: 155px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 1px solid rgba(255, 0, 0, .65);
            box-shadow: 0 0 35px rgba(255, 0, 0, .2), inset 0 0 35px rgba(255, 0, 0, .08);
            animation: corePulse 2s ease-in-out infinite;
            transition: margin 0.1s ease-out;
        }

        .core::before {
            content: "";
            position: absolute;
            inset: 22px;
            border: 1px solid rgba(255, 255, 255, .35);
        }

        .core::after {
            content: "";
            position: absolute;
            width: 32px;
            height: 32px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #ff1010;
            box-shadow: 0 0 20px #ff0000, 0 0 50px #ff0000, 0 0 90px rgba(255, 0, 0, .55);
        }

        @keyframes corePulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, .15), inset 0 0 20px rgba(255, 0, 0, .05); }
            50% { box-shadow: 0 0 75px rgba(255, 0, 0, .55), inset 0 0 45px rgba(255, 0, 0, .15); }
        }

        /* BRAND */
        .brand {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: brandReveal 4.5s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        .brand h1 {
            position: relative;
            font-size: clamp(58px, 10vw, 135px);
            line-height: .9;
            font-weight: 700;
            letter-spacing: -6px;
            white-space: nowrap;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, .45), 0 0 35px rgba(255, 0, 0, .12);
        }

        .brand h1 span {
            color: #ff1515;
            text-shadow: 0 0 8px #ff0000, 0 0 25px #ff0000, 0 0 55px rgba(255, 0, 0, .5);
        }

        /* GLITCH */
        .brand h1::before,
        .brand h1::after {
            content: "Nqat AI";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            opacity: 0;
        }

        .brand h1::before {
            color: #ff0000;
            animation: glitchRed 3s infinite;
        }

        .brand h1::after {
            color: #fff;
            animation: glitchWhite 3.4s infinite;
        }

        @keyframes glitchRed {
            0%, 88%, 100% { opacity: 0; transform: translate(0); }
            90% { opacity: .8; transform: translate(-5px, 1px); }
            92% { opacity: 0; }
            94% { opacity: .6; transform: translate(5px, -1px); }
        }

        @keyframes glitchWhite {
            0%, 90%, 100% { opacity: 0; transform: translate(0); }
            92% { opacity: .5; transform: translate(5px); }
            94% { opacity: 0; }
        }

        /* SUBTITLE */
        .subtitle {
            margin-top: 26px;
            font-size: 11px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #777;
            animation: subtitleAnimation 4.5s ease forwards;
        }

        .subtitle::before {
            content: "◆";
            color: #ff1111;
            margin-right: 12px;
            text-shadow: 0 0 10px red;
        }

        @keyframes subtitleAnimation {
            0%, 10% { opacity: 0; letter-spacing: 16px; }
            20%, 85% { opacity: 1; letter-spacing: 8px; }
            100% { opacity: 0.8; }
        }

        @keyframes brandReveal {
            0% { opacity: 0; filter: blur(25px); transform: scale(.65); }
            35% { opacity: 1; filter: blur(0); transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* PARTICLES */
        .particles { position: absolute; inset: 0; }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #ff1515;
            box-shadow: 0 0 8px #ff0000, 0 0 18px #ff0000;
            animation: particleFloat 3s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 8%; top: 22%; }
        .particle:nth-child(2) { left: 18%; top: 70%; animation-delay: .8s; }
        .particle:nth-child(3) { left: 30%; top: 12%; animation-delay: 1.5s; }
        .particle:nth-child(4) { left: 73%; top: 20%; animation-delay: .3s; }
        .particle:nth-child(5) { left: 87%; top: 67%; animation-delay: 1.2s; }
        .particle:nth-child(6) { left: 65%; top: 82%; animation-delay: 2s; }
        .particle:nth-child(7) { left: 92%; top: 35%; animation-delay: .5s; }
        .particle:nth-child(8) { left: 7%; top: 60%; animation-delay: 2.2s; }
        .particle:nth-child(9) { left: 48%; top: 8%; animation-delay: 1s; }
        .particle:nth-child(10) { left: 53%; top: 92%; animation-delay: 1.7s; }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) scale(.5); opacity: .2; }
            50% { transform: translateY(-35px) scale(1.4); opacity: 1; }
        }

        /* SCANNER */
        .scanner {
            position: absolute;
            width: 100%;
            height: 2px;
            left: 0;
            top: -5%;
            background: linear-gradient(90deg, transparent, #ff0000, #fff, #ff0000, transparent);
            box-shadow: 0 0 20px #ff0000, 0 0 50px rgba(255, 0, 0, .6);
            opacity: .5;
            animation: scan 3.5s linear infinite;
        }

        @keyframes scan {
            from { top: -5%; }
            to { top: 105%; }
        }

        /* HUD */
        .hud {
            position: absolute;
            inset: 28px;
            border: 1px solid rgba(255, 0, 0, .09);
            pointer-events: none;
        }

        .hud::before, .hud::after {
            content: "";
            position: absolute;
            width: 55px;
            height: 55px;
            border: 2px solid #ff1111;
            filter: drop-shadow(0 0 7px red);
        }

        .hud::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
        .hud::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }

        /* STATUS */
        .status {
            position: absolute;
            top: 45px;
            left: 55px;
            z-index: 20;
            font-size: 9px;
            letter-spacing: 3px;
            color: #777;
        }

        .status span {
            color: #ff1111;
            text-shadow: 0 0 10px red;
            margin-right: 8px;
        }

        .version {
            position: absolute;
            right: 55px;
            bottom: 45px;
            z-index: 20;
            color: #444;
            font-size: 9px;
            letter-spacing: 3px;
        }

        /* SKIP BUTTON */
        .skip-btn {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(255, 0, 0, 0.12);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #ff4444;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: #ff1111;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div id="fadeContainer" class="fade-container">
        <section class="hero">
            <div class="aura"></div>
            <div class="grid"></div>
            <div class="rings">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>

            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>

            <div class="scanner"></div>
            <div class="core"></div>

            <div class="brand">
                <h1>Nqat <span>AI</span></h1>
                <div class="subtitle">Agentic web Defense</div>
            </div>

            <div class="hud"></div>
            <div class="status"><span>●</span> Nqat AI WEB SECURITY INITIALIZING...</div>
            <div class="version">AI DEFENSE SYSTEM 2026</div>

            <button class="skip-btn" onclick="redirectToHome()">Skip Intro →</button>
        </section>
    </div>

    <script>
        const hero = document.querySelector(".hero");
        const rings = document.querySelector(".rings");
        const core = document.querySelector(".core");
        const fadeContainer = document.getElementById("fadeContainer");

        hero.addEventListener("mousemove", (event) => {
            const x = (event.clientX / window.innerWidth - .5);
            const y = (event.clientY / window.innerHeight - .5);
            rings.style.transform = `translate(-50%, -50%) translate(${x * 12}px, ${y * 12}px)`;
            core.style.marginLeft = `${x * 8}px`;
            core.style.marginTop = `${y * 8}px`;
        });

        hero.addEventListener("mouseleave", () => {
            rings.style.transform = "translate(-50%, -50%)";
            core.style.marginLeft = "0";
            core.style.marginTop = "0";
        });

        function redirectToHome() {
            fadeContainer.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "/";
            }, 600);
        }

        // Automatic redirect after animation finishes (4.2 seconds)
        setTimeout(() => {
            redirectToHome();
        }, 4200);
    </script>
</body>
</html>
